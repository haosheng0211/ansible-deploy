---
# =============================================================================
# alloy — Grafana Alloy log collector for Loki
# =============================================================================

- name: Stop legacy Promtail service if present
  ansible.builtin.systemd:
    name: promtail
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: Find legacy Grafana APT list files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: '^\s*deb .*https://apt\.grafana\.com'
  register: grafana_legacy_lists

- name: Remove legacy Grafana APT entries
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb .*https://apt\.grafana\.com.*$'
    state: absent
  loop: "{{ grafana_legacy_lists.files }}"
  register: grafana_legacy_removed

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present
  register: grafana_repository

- name: Update APT cache for Grafana repository
  ansible.builtin.apt:
    update_cache: true
  when: grafana_repository.changed or grafana_legacy_removed.changed

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present

- name: Add Alloy user to adm group
  ansible.builtin.user:
    name: alloy
    groups: adm
    append: true

- name: Ensure Alloy data directory exists
  ansible.builtin.file:
    path: /var/lib/alloy
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: restart alloy

- name: Ensure Alloy is running
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true

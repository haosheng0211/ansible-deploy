---
# =============================================================================
# mariadb — Install + secure (DB/user creation is in project role)
# =============================================================================

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download MariaDB repository signing key
  ansible.builtin.get_url:
    url: https://supplychain.mariadb.com/MariaDB-Server-GPG-KEY
    dest: /etc/apt/keyrings/mariadb.asc
    owner: root
    group: root
    mode: "0644"

- name: Find legacy MariaDB APT list files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: '^\s*deb .*https://mirror\.mariadb\.org/repo/'
  register: mariadb_legacy_lists

- name: Remove legacy MariaDB APT entries
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb .*https://mirror\.mariadb\.org/repo/.*$'
    state: absent
  loop: "{{ mariadb_legacy_lists.files }}"
  register: mariadb_legacy_removed

- name: Add MariaDB {{ mariadb_version }} repository
  ansible.builtin.deb822_repository:
    name: mariadb
    types: deb
    uris: "https://mirror.mariadb.org/repo/{{ mariadb_version }}/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/mariadb.asc
    state: present
  register: mariadb_repository

- name: Update APT cache for MariaDB repository
  ansible.builtin.apt:
    update_cache: true
  when: mariadb_repository.changed or mariadb_legacy_removed.changed

- name: Install MariaDB server
  apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-mysqldb
    state: present

- name: Ensure MariaDB is running
  systemd:
    name: mariadb
    state: started
    enabled: true

# -----------------------------------------------------------------------------
# Security hardening (equivalent to mysql_secure_installation)
# -----------------------------------------------------------------------------
- name: Set MariaDB root password
  ansible.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ mariadb_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    state: present

- name: Deploy MariaDB root credentials file
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"

- name: Remove anonymous users
  ansible.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove remote root access
  ansible.mysql.mysql_query:
    query: "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1')"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

# -----------------------------------------------------------------------------
# Server config
# -----------------------------------------------------------------------------
- name: Deploy MariaDB server config
  template:
    src: mariadb-server.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-custom.cnf
    mode: "0644"
  notify: restart mariadb

---
# =============================================================================
# php — PHP-FPM {{ php_version }}
# =============================================================================

- name: Ensure APT keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download ondrej/php PPA signing key
  get_url:
    url: >-
      https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6
    dest: /etc/apt/keyrings/ondrej-php.asc
    owner: root
    group: root
    mode: "0644"

- name: Verify ondrej/php PPA signing key fingerprint
  command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /etc/apt/keyrings/ondrej-php.asc
  register: ondrej_php_signing_key
  changed_when: false
  failed_when: >-
    'fpr:::::::::B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6:'
    not in ondrej_php_signing_key.stdout

- name: Find legacy ondrej/php APT list files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: '^\s*deb .*https?://ppa\.launchpad(content)?\.net/ondrej/php/ubuntu'
  register: ondrej_php_legacy_lists

- name: Remove legacy ondrej/php APT entries
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb .*https?://ppa\.launchpad(content)?\.net/ondrej/php/ubuntu.*$'
    state: absent
  loop: "{{ ondrej_php_legacy_lists.files }}"
  register: ondrej_php_legacy_removed

- name: Add ondrej/php PPA
  ansible.builtin.deb822_repository:
    name: ondrej-php
    types: deb
    uris: https://ppa.launchpadcontent.net/ondrej/php/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/ondrej-php.asc
    state: present
  register: ondrej_php_repository

- name: Update APT cache for ondrej/php PPA
  ansible.builtin.apt:
    update_cache: true
  when: ondrej_php_repository.changed or ondrej_php_legacy_removed.changed

- name: Install PHP {{ php_version }} and extensions
  apt:
    name:
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-redis"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-bcmath"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-readline"
      - "php{{ php_version }}-opcache"
    state: present

- name: Ensure PHP-FPM error log exists
  file:
    path: "/var/log/php{{ php_version }}-fpm-error.log"
    state: touch
    owner: "{{ projects_user }}"
    group: adm
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Configure PHP-FPM error log rotation
  template:
    src: php-fpm-error-logrotate.j2
    dest: "/etc/logrotate.d/php{{ php_version }}-fpm-error"
    mode: "0644"

- name: Deploy PHP-FPM production php.ini
  template:
    src: php.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/php.ini"
    mode: "0644"
  notify: restart php-fpm

- name: Deploy PHP-FPM pool config
  template:
    src: php-fpm-pool.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    mode: "0644"
  notify: restart php-fpm

- name: Deploy OPcache production config
  template:
    src: opcache.ini.j2
    dest: "/etc/php/{{ php_version }}/mods-available/opcache.ini"
    mode: "0644"
  notify: restart php-fpm

- name: Ensure PHP-FPM is running
  systemd:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true

# -----------------------------------------------------------------------------
# Composer
# -----------------------------------------------------------------------------
- name: Check if Composer is installed
  stat:
    path: /usr/local/bin/composer
  register: composer_bin

- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: "0755"
  when: not composer_bin.stat.exists

- name: Download Composer installer signature
  get_url:
    url: https://composer.github.io/installer.sig
    dest: /tmp/composer-setup.sig
    mode: "0644"
  when: not composer_bin.stat.exists

- name: Verify Composer installer signature
  command: >-
    php -r "if (hash_file('sha384', '/tmp/composer-setup.php') !==
    trim(file_get_contents('/tmp/composer-setup.sig'))) { exit(1); }"
  changed_when: false
  when: not composer_bin.stat.exists

- name: Install Composer
  command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  when: not composer_bin.stat.exists

- name: Remove Composer installer
  file:
    path: /tmp/composer-setup.php
    state: absent
  when: not composer_bin.stat.exists

- name: Remove Composer installer signature
  file:
    path: /tmp/composer-setup.sig
    state: absent
  when: not composer_bin.stat.exists

# -----------------------------------------------------------------------------
# cachetool — CLI 清除 FPM OPcache（部署後執行 opcache:reset --fcgi=<socket>）
# -----------------------------------------------------------------------------
- name: Install cachetool phar
  get_url:
    url: "https://github.com/gordalina/cachetool/releases/download/{{ cachetool_version }}/cachetool.phar"
    dest: /usr/local/bin/cachetool
    mode: "0755"
    force: false

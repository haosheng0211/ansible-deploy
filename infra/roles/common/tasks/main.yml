---
# =============================================================================
# common — Base system setup
# =============================================================================

- name: Refresh APT and upgrade installed packages
  ansible.builtin.import_tasks: upgrade-packages.yml

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - htop
      - acl
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - python3-debian
      - ntp
      - logrotate
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

- name: Ensure NTP is running
  systemd:
    name: ntp
    state: started
    enabled: true

# -----------------------------------------------------------------------------
# Deploy and application runtime users
# -----------------------------------------------------------------------------
- name: Create deploy group
  group:
    name: "{{ deploy_group }}"
    state: present

- name: Create shared application group
  group:
    name: "{{ projects_group }}"
    system: true
    state: present

- name: Ensure shared application runtime user
  user:
    name: "{{ projects_user }}"
    group: "{{ projects_group }}"
    home: "{{ projects_home }}"
    shell: /usr/sbin/nologin
    create_home: true
    system: true
    state: present

- name: Ensure application runtime home exists
  file:
    path: "{{ projects_home }}"
    state: directory
    owner: "{{ projects_user }}"
    group: "{{ projects_group }}"
    mode: "0750"

- name: Create deploy user
  user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    groups: "{{ projects_group }}"
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure shared application projects root exists
  file:
    path: "{{ projects_root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ projects_group }}"
    mode: "2755"

- name: Add SSH authorized key for deploy user
  authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
    state: present

- name: Allow deploy user limited sudo without password
  copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: |
      Cmnd_Alias PHP_FPM_CONTROL = /usr/bin/systemctl reload php{{ php_version }}-fpm, \
          /usr/bin/systemctl restart php{{ php_version }}-fpm, \
          /usr/sbin/service php{{ php_version }}-fpm reload, \
          /usr/sbin/service php{{ php_version }}-fpm restart, \
          /usr/local/bin/cachetool opcache\:reset --fcgi\=/run/php/php{{ php_version }}-fpm.sock
      {{ deploy_user }} ALL=(root) NOPASSWD: PHP_FPM_CONTROL
      {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/supervisorctl *
    mode: "0440"
    validate: "visudo -cf %s"

# -----------------------------------------------------------------------------
# SSH hardening (enable after verifying deploy user can login)
#
# A drop-in read before /etc/ssh/sshd_config.d/50-cloud-init.conf and the main
# file, so cloud images that set PasswordAuthentication yes or
# PermitRootLogin yes cannot override it (sshd keeps the first value it reads).
# -----------------------------------------------------------------------------
- name: Require sshd_config to include sshd_config.d
  command: grep -Eq '^Include /etc/ssh/sshd_config\.d/\*\.conf' /etc/ssh/sshd_config
  changed_when: false
  when: ssh_hardening_enabled | default(false)

- name: Deploy SSH hardening drop-in
  template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart ssh
  when: ssh_hardening_enabled | default(false)

- name: Remove SSH hardening drop-in when hardening is disabled
  file:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    state: absent
  notify: restart ssh
  when: not (ssh_hardening_enabled | default(false))

# -----------------------------------------------------------------------------
# Kernel security (sysctl)
# -----------------------------------------------------------------------------
- name: Harden kernel network parameters
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    # Prevent IP spoofing
    - { key: "net.ipv4.conf.all.rp_filter", value: "1" }
    - { key: "net.ipv4.conf.default.rp_filter", value: "1" }
    # Ignore ICMP redirects
    - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { key: "net.ipv6.conf.all.accept_redirects", value: "0" }
    # Don't send ICMP redirects
    - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.send_redirects", value: "0" }
    # Ignore source-routed packets
    - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { key: "net.ipv6.conf.all.accept_source_route", value: "0" }
    # SYN flood protection
    - { key: "net.ipv4.tcp_syncookies", value: "1" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "2048" }
    # Log suspicious packets
    - { key: "net.ipv4.conf.all.log_martians", value: "1" }
    - { key: "net.ipv4.conf.default.log_martians", value: "1" }
    # Ignore ICMP broadcast
    - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    # Disable IPv6 if not needed
    - { key: "net.ipv6.conf.all.disable_ipv6", value: "1" }
    - { key: "net.ipv6.conf.default.disable_ipv6", value: "1" }

# -----------------------------------------------------------------------------
# File permissions
# -----------------------------------------------------------------------------
- name: Restrict cron access to root
  file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
  loop:
    - /etc/cron.allow
    - /etc/at.allow

- name: Ensure deploy user is in cron.allow
  lineinfile:
    path: /etc/cron.allow
    line: "{{ deploy_user }}"

- name: Ensure root is in cron.allow
  lineinfile:
    path: /etc/cron.allow
    line: root

# -----------------------------------------------------------------------------
# Unattended upgrades
# -----------------------------------------------------------------------------
- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present

- name: Enable unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

# -----------------------------------------------------------------------------
# Shared memory security
# -----------------------------------------------------------------------------
- name: Secure shared memory
  lineinfile:
    path: /etc/fstab
    regexp: "tmpfs.*/run/shm"
    line: "tmpfs /run/shm tmpfs defaults,noexec,nosuid 0 0"

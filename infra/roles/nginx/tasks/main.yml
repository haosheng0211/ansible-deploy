---
# =============================================================================
# nginx — Install only (site config is in project role)
# =============================================================================

- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Deploy optimized nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: reload nginx

- name: Remove default site
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  notify: reload nginx

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: started
    enabled: true

---
# =============================================================================
# nodejs — Node.js + Yarn
# =============================================================================

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Find legacy NodeSource APT list files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: '^\s*deb .*https://deb\.nodesource\.com/node_'
  register: nodesource_legacy_lists

- name: Remove legacy NodeSource APT entries
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb .*https://deb\.nodesource\.com/node_.*$'
    state: absent
  loop: "{{ nodesource_legacy_lists.files }}"
  register: nodesource_legacy_removed

- name: Add NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
  register: nodesource_repository

- name: Update APT cache for NodeSource repository
  ansible.builtin.apt:
    update_cache: true
  when: nodesource_repository.changed or nodesource_legacy_removed.changed

- name: Install Node.js
  apt:
    name: nodejs
    state: present

- name: Install Yarn globally
  npm:
    name: yarn
    global: true
    state: present

- name: Install PM2 globally
  npm:
    name: pm2
    global: true
    state: present

- name: Setup PM2 startup script
  command: "pm2 startup systemd -u {{ projects_user }} --hp {{ projects_home }}"
  args:
    creates: "/etc/systemd/system/pm2-{{ projects_user }}.service"

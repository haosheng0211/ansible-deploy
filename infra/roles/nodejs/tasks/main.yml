---
# =============================================================================
# nodejs — Node.js + Yarn
# =============================================================================

- name: Add NodeSource GPG key
  apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Add NodeSource repository
  apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    state: present
    update_cache: true

- name: Install Node.js
  apt:
    name: nodejs
    state: present

- name: Install Yarn via corepack
  command: corepack enable yarn
  args:
    creates: /usr/lib/node_modules/corepack/dist/yarn.js

- name: Install PM2 globally
  npm:
    name: pm2
    global: true
    state: present

- name: Setup PM2 startup script
  command: "pm2 startup systemd -u {{ deploy_user }} --hp /home/{{ deploy_user }}"
  args:
    creates: "/etc/systemd/system/pm2-{{ deploy_user }}.service"

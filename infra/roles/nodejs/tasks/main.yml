---
# =============================================================================
# nodejs — Node.js + Yarn
# =============================================================================

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    state: present
    update_cache: true

- name: Install Node.js
  apt:
    name: nodejs
    state: present

- name: Install Yarn globally
  npm:
    name: yarn
    global: true
    state: present

- name: Install PM2 globally
  npm:
    name: pm2
    global: true
    state: present

- name: Setup PM2 startup script
  command: "pm2 startup systemd -u {{ projects_user }} --hp {{ projects_home }}"
  args:
    creates: "/etc/systemd/system/pm2-{{ projects_user }}.service"

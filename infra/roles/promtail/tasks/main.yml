---
# =============================================================================
# promtail — Grafana Loki log collector
# =============================================================================

- name: Create promtail group
  group:
    name: promtail
    system: true
    state: present

- name: Create promtail user
  user:
    name: promtail
    group: promtail
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Add promtail user to adm group (for reading log files)
  user:
    name: promtail
    groups: adm
    append: true

- name: Check if promtail is installed
  stat:
    path: /usr/local/bin/promtail
  register: promtail_bin

- name: Download Promtail
  get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
    dest: /tmp/promtail.zip
  when: not promtail_bin.stat.exists

- name: Install unzip for extraction
  apt:
    name: unzip
    state: present
  when: not promtail_bin.stat.exists

- name: Extract Promtail
  unarchive:
    src: /tmp/promtail.zip
    dest: /tmp
    remote_src: true
  when: not promtail_bin.stat.exists

- name: Install Promtail binary
  copy:
    src: /tmp/promtail-linux-amd64
    dest: /usr/local/bin/promtail
    owner: promtail
    group: promtail
    mode: "0755"
    remote_src: true
  when: not promtail_bin.stat.exists
  notify: restart promtail

- name: Clean up download
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/promtail.zip
    - /tmp/promtail-linux-amd64
  when: not promtail_bin.stat.exists

- name: Create Promtail config directory
  file:
    path: /etc/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0755"

- name: Create Promtail data directory
  file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0755"

- name: Deploy Promtail config
  template:
    src: promtail.yml.j2
    dest: /etc/promtail/promtail.yml
    owner: promtail
    group: promtail
    mode: "0644"
  notify: restart promtail

- name: Deploy Promtail systemd service
  template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    mode: "0644"
  notify: restart promtail

- name: Ensure Promtail is running
  systemd:
    name: promtail
    state: started
    enabled: true
    daemon_reload: true

---
# =============================================================================
# setup-server.yml — Base server provisioning (run once per new ECS)
#
# Installs all software, hardens the system. No project-specific config.
#
# Usage:
#   ansible-playbook playbooks/setup-server.yml
# =============================================================================
- name: Setup production server
  hosts: production
  become: true

  vars_files:
    - ../group_vars/production.yml

  pre_tasks:
    - name: Load this server's local settings
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../group_vars/production.local.yml') }}"
      tags: [always]

    - name: Refuse the default MariaDB root password
      ansible.builtin.assert:
        that:
          - mariadb_root_password is defined
          - mariadb_root_password | string != 'CHANGE_ME'
        fail_msg: >-
          mariadb_root_password is still set to the default value.
          Set a unique password or provide the variable through Ansible Vault
          before running this playbook.
      when: mariadb_enabled | default(true) | bool
      tags: [mariadb]

    - name: Require a Loki endpoint when Alloy is enabled
      ansible.builtin.assert:
        that:
          - loki_push_url is defined
          - loki_push_url | string | length > 0
        fail_msg: Set loki_push_url before enabling Alloy.
      when: alloy_enabled | default(false) | bool
      tags: [alloy]

  roles:
    - role: common
      tags: [common]
    - role: ufw
      tags: [ufw]
      when: ufw_enabled | default(true) | bool
    - role: fail2ban
      tags: [fail2ban]
    - role: nginx
      tags: [nginx]
    - role: php
      tags: [php]
    - role: nodejs
      tags: [nodejs]
      when: nodejs_enabled | default(true) | bool
    - role: mariadb
      tags: [mariadb]
      when: mariadb_enabled | default(true) | bool
    - role: redis
      tags: [redis]
    - role: supervisor
      tags: [supervisor]
    - role: node-exporter
      tags: [node-exporter]
      when: node_exporter_enabled | default(true) | bool
    - role: alloy
      tags: [alloy]
      when: alloy_enabled | default(false) | bool

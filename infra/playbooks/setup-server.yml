---
# =============================================================================
# setup-server.yml — Base server provisioning (run once per new ECS)
#
# Installs all software, hardens the system. No project-specific config.
#
# Usage:
#   ansible-playbook playbooks/setup-server.yml -i inventory/production.ini
# =============================================================================
- name: Setup production server
  hosts: production
  become: true

  vars_files:
    - ../group_vars/production.yml

  roles:
    - common
    - ufw
    - fail2ban
    - nginx
    - php
    - nodejs
    - mariadb
    - redis
    - supervisor
    - node-exporter
    - role: promtail
      when: promtail_enabled | default(false)

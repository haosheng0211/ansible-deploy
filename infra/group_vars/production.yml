# =============================================================================
# Server-level variables (shared by all projects on this server)
# =============================================================================

# Server
deploy_user: deploy
deploy_group: deploy
deploy_ssh_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
projects_user: www-data
projects_group: www-data
projects_home: /var/lib/www-data  # Writable runtime home for PM2, separate from /var/www
projects_root: /var/www
timezone: Asia/Taipei  # 專案資料庫用 UTC 時，主機也設 UTC，log 時間才一致

# SSH hardening — 先用 deploy 用戶測試能登入後再改為 true
ssh_hardening_enabled: false

# Firewall — 設為 false 時略過 UFW，改由雲端防火牆／安全群組管理連入規則
# ufw_enabled: true

# UFW — SSH allowed IPs (leave empty to allow all)
ssh_allowed_ips: []
#  - 1.2.3.4

# UFW — Allow Prometheus to scrape Node Exporter :9100
monitoring_allowed_ips: []
#  - 10.0.0.x    # 共用 ECS 內網 IP

# Nginx
nginx_access_log_format: combined          # json：一行一筆，給 SLS／Loki 等 log 收集器
nginx_cloudflare_realip_enabled: false     # 所有站台都走 Cloudflare 代理時開啟，還原用戶端真實 IP

# PHP
php_version: "8.2"
cachetool_version: "9.0.0"    # CLI 清除 FPM OPcache（gordalina/cachetool）
php_upload_max_filesize: 20M   # 單一上傳檔案上限
php_post_max_size: 25M         # multipart request 上限，保留表單額外資料空間
php_memory_limit: 256M
php_opcache_memory_consumption: 256
php_fpm_max_children: 24
php_fpm_start_servers: 4
php_fpm_min_spare_servers: 4
php_fpm_max_spare_servers: 8

# MariaDB — Set false for RDS / external databases
mariadb_enabled: true
mariadb_version: "10.11"
mariadb_root_password: "CHANGE_ME"
mariadb_innodb_buffer_pool_size: 1G      # 4C8G 與 PHP/Redis/Node 共用主機的保守基線
mariadb_max_connections: 100

# Node.js — 主機不跑 Node 程式（前端在別處建置）時設為 false
nodejs_enabled: true
nodejs_major_version: "22"

# Redis
redis_maxmemory: 512mb    # 4C8G 共用主機的保守快取基線
# Laravel queue、JWT 黑名單與快取共用同一個 Redis；用 LRU 會在記憶體滿時刪掉 queue job 與黑名單，
# 因此預設滿了就拒絕寫入。只放快取的 Redis 才改回 allkeys-lru。
redis_maxmemory_policy: noeviction

# Node Exporter — 沒有 Prometheus 來抓時設為 false；啟用時 :9100 對所有網卡開放，關閉 UFW 須由安全群組限制
node_exporter_enabled: true
node_exporter_version: "1.8.2"

# Grafana Alloy + Loki (設為 false 可跳過安裝)
alloy_enabled: false
loki_push_url: ""   # 填入共用 ECS 的 Loki 地址，例如 http://10.0.0.x:3100/loki/api/v1/push

# MariaDB durability
# 1 + sync_binlog=1 provides the strongest crash-durability guarantee.
mariadb_innodb_flush_log_at_trx_commit: 1
mariadb_sync_binlog: 1
